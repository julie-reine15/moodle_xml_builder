<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Créateur de banque de questions Moodle — générez votre fichier XML Moodle directement dans votre navigateur, sans installation." />
  <meta name="robots" content="noindex" />

  <title>Moodle XML Builder</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- TinyMCE (CDN, free — editor code only, no data transmitted) -->
  <script src="https://cdn.tiny.cloud/1/no-api-key/tinymce/7/tinymce.min.js" referrerpolicy="origin"></script>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════ HEADER -->
  <header class="app-header" role="banner">
    <div class="header-brand">
      <span class="header-logo">
        Moodle XML Builder
        <span data-i18n="app.subtitle"></span>
      </span>
    </div>

    <div class="header-actions">
      <!-- Privacy badge (opens modal) -->
      <button
        class="privacy-badge"
        id="privacy-learn-more"
        data-i18n="privacy.badge"
        aria-haspopup="dialog"
        type="button">
      </button>

      <!-- Language toggle -->
      <button
        class="btn-lang"
        id="btn-lang"
        type="button"
        aria-label="Switch language / Changer de langue">
        English
      </button>
    </div>
  </header>

  <!-- ═══════════════════════════════════════════════════════ MAIN LAYOUT -->
  <div class="app-layout">

    <!-- ── Sidebar Navigation ── -->
    <nav class="app-nav" role="navigation" aria-label="Navigation principale">
      <span class="nav-section-label">Menu</span>

      <a href="#" class="nav-link active" data-section="categories" role="menuitem">
        <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z"/>
        </svg>
        <span data-i18n="nav.categories"></span>
        <span class="nav-badge" id="badge-categories" aria-live="polite">0</span>
      </a>

      <a href="#" class="nav-link" data-section="questions" role="menuitem">
        <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
          <path d="M12 17h.01"/>
        </svg>
        <span data-i18n="nav.questions"></span>
        <span class="nav-badge" id="badge-questions" aria-live="polite">0</span>
      </a>

      <a href="#" class="nav-link" data-section="export" role="menuitem">
        <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        <span data-i18n="nav.export"></span>
      </a>
    </nav>

    <!-- ── Main Content ── -->
    <main class="app-main" id="app-main" role="main">

      <!-- ─────────────────────────────────────── SECTION: Categories -->
      <section id="section-categories" class="app-section" aria-labelledby="heading-categories">
        <div class="section-header">
          <h2 id="heading-categories" data-i18n="categories.title"></h2>
          <p class="section-description" data-i18n="categories.description"></p>
          <div class="section-actions">
            <button class="btn btn-primary" id="btn-add-category" type="button">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              <span data-i18n="categories.add"></span>
            </button>
          </div>
        </div>

        <!-- Category form (hidden by default) -->
        <div class="card hidden" id="category-form-card">
          <form id="category-form" novalidate>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="cat-name">
                  <span data-i18n="categories.add"></span>
                  <span class="required-mark" aria-hidden="true">*</span>
                </label>
                <input
                  type="text"
                  id="cat-name"
                  class="form-input"
                  data-i18n-placeholder="categories.namePlaceholder"
                  required
                  autocomplete="off"
                />
                <div class="field-error hidden" id="cat-name-error" role="alert"></div>
              </div>
              <div class="form-group">
                <label class="form-label" for="cat-desc">
                  <span data-i18n="categories.descPlaceholder"></span>
                </label>
                <input
                  type="text"
                  id="cat-desc"
                  class="form-input"
                  data-i18n-placeholder="categories.descPlaceholder"
                  autocomplete="off"
                />
              </div>
            </div>
            <div class="card-actions" style="justify-content:flex-end; gap: var(--space-3);">
              <button type="button" class="btn btn-ghost" id="btn-cancel-category">
                <span data-i18n="common.cancel"></span>
              </button>
              <button type="submit" class="btn btn-primary">
                <span data-i18n="common.save"></span>
              </button>
            </div>
          </form>
        </div>

        <!-- Categories list -->
        <div id="categories-list" class="item-list" role="list" aria-live="polite">
          <!-- Empty state shown when no categories -->
          <div class="empty-state" id="categories-empty">
            <div class="empty-state-icon" aria-hidden="true">🗂️</div>
            <p class="empty-state-text" data-i18n="categories.empty"></p>
          </div>
        </div>
      </section>

      <!-- ─────────────────────────────────────── SECTION: Questions -->
      <section id="section-questions" class="app-section hidden" aria-labelledby="heading-questions">
        <div class="section-header">
          <h2 id="heading-questions" data-i18n="questions.title"></h2>
          <div class="section-actions">
            <button class="btn btn-primary" id="btn-add-question" type="button">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              <span data-i18n="questions.add"></span>
            </button>
          </div>
        </div>

        <!-- Question form (hidden by default, populated dynamically) -->
        <div class="card hidden" id="question-form-card">
          <div id="question-form-container">
            <!-- Dynamic form inserted by questionForms.js -->
          </div>
        </div>

        <!-- Questions list -->
        <div id="questions-list" class="item-list" role="list" aria-live="polite">
          <div class="empty-state" id="questions-empty">
            <div class="empty-state-icon" aria-hidden="true">❓</div>
            <p class="empty-state-text" data-i18n="questions.empty"></p>
          </div>
        </div>
      </section>

      <!-- ─────────────────────────────────────── SECTION: Export -->
      <section id="section-export" class="app-section hidden" aria-labelledby="heading-export">
        <div class="section-header">
          <h2 id="heading-export" data-i18n="export.title"></h2>
          <p class="section-description" data-i18n="export.description"></p>
        </div>

        <div class="card">
          <div class="form-group">
            <label class="form-label" for="export-filename">
              <span data-i18n="export.filename"></span>
            </label>
            <input
              type="text"
              id="export-filename"
              class="form-input"
              value="moodle-questions"
              autocomplete="off"
              style="max-width: 360px;"
            />
            <span class="form-hint">.xml</span>
          </div>

          <div class="notice notice-info" style="margin-bottom: var(--space-5);">
            <span aria-hidden="true">💡</span>
            <span data-i18n="export.saveDialogHint"></span>
          </div>

          <div id="export-no-questions" class="notice notice-warning hidden">
            <span aria-hidden="true">⚠️</span>
            <span data-i18n="export.noQuestions"></span>
          </div>

          <button class="btn btn-accent btn-lg" id="btn-download-xml" type="button">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            <span data-i18n="export.download"></span>
          </button>
        </div>
      </section>

    </main>
  </div>

  <!-- ═══════════════════════════════════════════════════════ FOOTER -->
  <footer class="app-footer" role="contentinfo">
    <div class="footer-privacy">
      <span class="footer-privacy-icon" aria-hidden="true">🔒</span>
      <span data-i18n="footer.privacy"></span>
      <button
        class="btn btn-ghost btn-sm"
        id="footer-privacy-link"
        type="button"
        style="padding: 0; font-size: var(--text-xs); color: var(--color-primary);"
        data-i18n="footer.privacyLink">
      </button>
    </div>
    <div class="footer-links">
      <a href="https://github.com/" id="footer-github-link" target="_blank" rel="noopener noreferrer" data-i18n="footer.github"></a>
      <span style="color: var(--color-border);">·</span>
      <span data-i18n="footer.madeFor"></span>
    </div>
  </footer>

  <!-- ═══════════════════════════════════════════════════════ PRIVACY MODAL -->
  <div class="modal-overlay" id="privacy-overlay" hidden role="presentation"></div>

  <div
    class="modal"
    id="privacy-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="privacy-modal-title"
    hidden>

    <div class="modal-icon" aria-hidden="true">🔒</div>

    <h2 id="privacy-modal-title" data-i18n="privacy.title"></h2>

    <div class="modal-body">
      <p data-i18n="privacy.body"></p>

      <ul class="modal-checklist" role="list">
        <li id="privacy-check-1"></li>
        <li id="privacy-check-2"></li>
        <li id="privacy-check-3"></li>
      </ul>
    </div>

    <div class="modal-footer">
      <button class="btn btn-primary" id="privacy-close" type="button" data-i18n="privacy.close"></button>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════ SCRIPTS -->
  <script type="module" src="js/main.js"></script>

</body>
</html>
